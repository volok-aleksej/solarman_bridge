<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solarman Bridge</title>
<!-- Every URL is relative: the page also works behind a reverse proxy that
     mounts this service under a path prefix. -->
<link rel="stylesheet" href="style.css">
<script defer src="chart.umd.min.js"></script>
<script defer src="alpine.min.js"></script>
</head>
<body x-data="inverter()" x-init="init()">

<header>
  <span class="logo">&#9728; Solarman Bridge</span>
  <nav class="tabs">
    <button :class="{active: tab==='realtime'}" @click="openTab('realtime')">Realtime</button>
    <button :class="{active: tab==='history'}"  @click="openTab('history')">History</button>
    <button :class="{active: tab==='energy'}"   @click="openTab('energy')">Energy</button>
    <button :class="{active: tab==='info'}"     @click="openTab('info')">Info</button>
  </nav>
  <span class="hdr-status" x-text="status"></span>
</header>

<!-- ═══════════════════════ REALTIME ═══════════════════════ -->
<div x-show="tab==='realtime'">

  <div class="offline-banner" x-show="live.sample && !live.online">
    No fresh data from the inverter — showing the last sample
    (<span x-text="ageText()"></span> old).
  </div>

  <template x-if="s">
  <div>
    <!-- Power flow, laid out like the inverter's own home screen. Each line
         is drawn from its node towards the centre; "in" animates along it,
         "out" against it. -->
    <svg class="flow-svg" viewBox="0 0 640 370">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
        </marker>
      </defs>

      <!-- Alpine cannot loop inside SVG (no <template> there): one path each. -->
      <path class="flow-path" d="M175,90 H245 V170 H284" :class="flowDir('pv')"
            :marker-end="flowDir('pv')==='in' ? 'url(#arrow)' : null"
            :marker-start="flowDir('pv')==='out' ? 'url(#arrow)' : null"></path>
      <path class="flow-path" d="M175,270 H245 V190 H284" :class="flowDir('batt')"
            :marker-end="flowDir('batt')==='in' ? 'url(#arrow)' : null"
            :marker-start="flowDir('batt')==='out' ? 'url(#arrow)' : null"></path>
      <path class="flow-path" d="M465,90 H395 V170 H356" :class="flowDir('grid')"
            :marker-end="flowDir('grid')==='in' ? 'url(#arrow)' : null"
            :marker-start="flowDir('grid')==='out' ? 'url(#arrow)' : null"></path>
      <path class="flow-path" d="M465,270 H395 V190 H356" :class="flowDir('load')"
            :marker-end="flowDir('load')==='in' ? 'url(#arrow)' : null"
            :marker-start="flowDir('load')==='out' ? 'url(#arrow)' : null"></path>

      <g class="flow-center" :class="{clickable: canControl()}" @click="toggleInverter()">
        <circle cx="320" cy="180" r="34" :class="s.run_state===2 ? 'on' : 'off'"></circle>
        <text x="320" y="186" text-anchor="middle"
              x-text="s.run_state===2 ? 'ON' : live.run_state_name.toUpperCase()"></text>
      </g>

      <!-- Under each node: power now, current now, energy today. -->
      <g class="flow-node" transform="translate(110,90)">
        <text class="fn-icon" y="-30">&#9728;&#65039;</text>
        <text class="fn-value pos" y="10" x-text="watts(s.pv1_power_w + s.pv2_power_w)"></text>
        <text class="fn-sub" y="30" x-text="amps(s.pv1_current_ma + s.pv2_current_ma)"></text>
        <text class="fn-sub" y="48" x-text="'generated ' + kwh(s.day_pv_wh)"></text>
      </g>
      <g class="flow-node" transform="translate(110,270)">
        <text class="fn-icon" y="-30">&#128267;</text>
        <text class="fn-soc" y="-6" x-text="s.batt_soc_pct + ' %'"></text>
        <text class="fn-value" y="18" :class="s.batt_power_w < 0 ? 'pos' : s.batt_power_w > 0 ? 'neg' : ''"
              x-text="watts(s.batt_power_w)"></text>
        <text class="fn-sub" y="38" x-text="amps(s.batt_current_ma)"></text>
        <text class="fn-sub" y="56" x-text="'charged ' + kwh(s.day_batt_charge_wh)"></text>
        <text class="fn-sub" y="72" x-text="'discharged ' + kwh(s.day_batt_discharge_wh)"></text>
      </g>
      <g class="flow-node" transform="translate(530,90)">
        <text class="fn-icon" y="-30">&#9889;</text>
        <text class="fn-value" y="10" :class="s.grid_power_w > 0 ? 'neg' : s.grid_power_w < 0 ? 'pos' : ''"
              x-text="watts(s.grid_power_w)"></text>
        <text class="fn-sub" y="30" x-text="amps(s.grid_l1_current_ma + s.grid_l2_current_ma + s.grid_l3_current_ma)"></text>
        <text class="fn-sub" y="48" x-text="'bought ' + kwh(s.day_grid_buy_wh)"></text>
        <text class="fn-sub" y="64" x-text="'sold ' + kwh(s.day_grid_sell_wh)"></text>
      </g>
      <g class="flow-node" transform="translate(530,270)">
        <text class="fn-icon" y="-30">&#127968;</text>
        <text class="fn-value" y="10" x-text="watts(s.load_power_w)"></text>
        <text class="fn-sub" y="30" x-text="'≈ ' + amps(loadCurrentMa())"></text>
        <text class="fn-sub" y="48" x-text="'consumed ' + kwh(s.day_load_wh)"></text>
      </g>
    </svg>

    <div class="status-strip">
      <span class="flag" :class="live.run_state_name==='normal' ? 'on' : 'err'"
            x-text="'State: '+live.run_state_name"></span>
      <span class="flag err" x-show="s.fault_bits"
            x-text="'Faults: 0x'+s.fault_bits.toString(16).toUpperCase()"></span>
      <span class="flag err" x-show="s.warning_bits"
            x-text="'Warnings: 0x'+s.warning_bits.toString(16).toUpperCase()"></span>
      <span class="sep"></span>
      <span class="muted" x-text="live.inverter_time ? 'Inverter clock: '+live.inverter_time : ''"></span>
      <span class="muted" x-text="cmdStatus"></span>
    </div>

    <details class="rt-details">
      <summary>Details</summary>
      <div class="info-grid">
        <template x-for="row in detailRows()" :key="row[0]">
          <div class="info-row">
            <span class="ir-label" x-text="row[0]"></span>
            <span class="ir-value" x-text="row[1]"></span>
          </div>
        </template>
      </div>

    <div class="phase-wrap">
      <table class="phase-table">
        <thead>
          <tr><th>Phase</th><th>Grid V</th><th>Grid W</th><th>Inverter W</th><th>Load V</th><th>Load W</th></tr>
        </thead>
        <tbody>
          <template x-for="p in [1,2,3]" :key="p">
            <tr>
              <td x-text="'L'+p"></td>
              <td x-text="(s['grid_l'+p+'_voltage_mv']/1000).toFixed(1)"></td>
              <td x-text="s['grid_l'+p+'_power_w']"></td>
              <td x-text="s['inv_l'+p+'_power_w']"></td>
              <td x-text="(s['load_l'+p+'_voltage_mv']/1000).toFixed(1)"></td>
              <td x-text="s['load_l'+p+'_power_w']"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    </details>
  </div>
  </template>

  <div class="info-empty" x-show="!s">No data received yet</div>
</div>

<!-- ═══════════════════════ HISTORY ════════════════════════ -->
<div x-show="tab==='history'">
  <div class="history-toolbar">
    <template x-for="h in [1,6,12,24,168]" :key="h">
      <button :class="{on: histHours===h}" @click="histHours=h; loadHistory()"
              x-text="h===168 ? '7d' : h+'h'"></button>
    </template>
    <span class="hdr-status" x-text="histStatus"></span>
  </div>
  <div class="charts">
    <div class="chart-box"><canvas id="cp"></canvas></div>
    <div class="chart-box sm"><canvas id="cs"></canvas></div>
    <div class="chart-box sm"><canvas id="cb"></canvas></div>
    <div class="chart-box"><canvas id="cg"></canvas></div>
  </div>
</div>

<!-- ═══════════════════════ ENERGY ═════════════════════════ -->
<div x-show="tab==='energy'">
  <div class="energy-toolbar">
    <button @click="shiftEnergyMonth(-1)">&larr;</button>
    <span class="energy-month-label" x-text="energyMonthLabel()"></span>
    <button @click="shiftEnergyMonth(1)" :disabled="!canNextEnergyMonth()">&rarr;</button>
    <span class="hdr-status" x-text="energyStatus"></span>
  </div>
  <div class="energy-totals" x-show="energyTotals" x-text="energyTotals"></div>
  <div class="charts">
    <div class="chart-box" style="height:320px"><canvas id="ce"></canvas></div>
  </div>
</div>

<!-- ═══════════════════════ INFO ═══════════════════════════ -->
<div x-show="tab==='info'">
  <div class="info-grid">
    <template x-for="row in infoRows()" :key="row[0]">
      <div class="info-row">
        <span class="ir-label" x-text="row[0]"></span>
        <span class="ir-value" x-text="row[1]"></span>
      </div>
    </template>
  </div>

  <div class="control-block" x-show="info && info.control.enabled">
    <span class="ir-label">Inverter control</span>
    <template x-for="c in (info ? info.control.commands : [])" :key="c.name">
      <button :disabled="cmdBusy" @click="runCommand(c)" x-text="cmdLabel(c.name)"></button>
    </template>
    <span class="hdr-status" x-text="cmdStatus"></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
