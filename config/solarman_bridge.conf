# solarman_bridge configuration

# ---- Logging (global) ------------------------------------------------------
# Verbosity: 1=error 2=warning 3=info 4=debug 5=trace. -D flag overrides.
# trace also dumps every V5 frame sent / received.
log_level = 3

# Log file path. Empty = stdout only. When set, duplicated to file (append).
# log_file = ""

# ---- Solarman WiFi logger --------------------------------------------------
# host and serial are REQUIRED.
logger {
    host   = "192.168.0.108"

    # Serial number of the LOGGER (not the inverter). Shown as "Device serial
    # number" on the logger's own web page (status.html, admin/admin).
    serial = 3581987480

    # optional
    # port           = 8899    # Solarman V5 TCP port
    # slave_id       = 1       # Modbus address of the inverter behind the logger
    # timeout_ms     = 5000    # per request
    # poll_period_ms = 1000    # live data; one cycle = 3 register reads, ~0.85 s
    # reconnect_ms   = 10000   # pause after a lost connection
}

# ---- HTTP dashboard --------------------------------------------------------
http {
    port     = 8081
    www_root = "/usr/share/solarman_bridge/www"
}

# ---- Telemetry history -----------------------------------------------------
history {
    db_path        = "/var/lib/solarman_bridge/history.sqlite3"
    # Raw samples older than this are purged; daily energy rows are kept.
    retention_days = 30
    # One stored sample (and daily energy update) per this many ms; the live
    # view is refreshed every logger.poll_period_ms regardless.
    # sample_period_ms = 5000
}

# ---- Inverter control ------------------------------------------------------
# Allows the dashboard (POST api/command) to switch the inverter on and off.
# Every write is logged. There is no authentication: put the service behind
# a proxy with auth before enabling it on a network you do not trust.
control {
    enabled = false
}
